<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Purple Book</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              cyber: {
                dark: '#0f172a',
                darker: '#020617',
                panel: '#1e293b',
                red: '#ef4444',
                blue: '#3b82f6',
                purple: '#8b5cf6',
                green: '#10b981',
                text: '#e2e8f0',
                muted: '#94a3b8'
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scanline': 'scanline 8s linear infinite',
            },
            keyframes: {
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #020617;
        color: #e2e8f0;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #020617; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155; 
      }

      .scanline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.2;
      }
      
      .prose h1 { @apply text-3xl font-bold mb-6 text-white tracking-tight; }
      .prose h2 { @apply text-2xl font-semibold mt-10 mb-4 text-white border-b border-slate-800 pb-2 flex items-center gap-2; }
      .prose h3 { @apply text-xl font-semibold mt-8 mb-3 text-cyan-400; }
      .prose p { @apply mb-4 leading-relaxed text-slate-300; }
      .prose ul { @apply list-disc list-outside ml-4 mb-4 space-y-2 text-slate-300 marker:text-cyber-purple; }
      .prose ol { @apply list-decimal list-outside ml-4 mb-4 space-y-2 text-slate-300 marker:text-cyber-blue; }
      .prose code { @apply font-mono text-sm bg-slate-900/50 px-1.5 py-0.5 rounded border border-slate-700/50 text-cyan-300; }
      .prose pre { @apply font-mono text-sm bg-slate-950 p-4 rounded-lg overflow-x-auto mb-6 border border-slate-800 shadow-inner; }
      .prose pre code { @apply bg-transparent p-0 text-slate-300 border-none; }
      .prose blockquote { @apply border-l-4 border-cyber-purple bg-cyber-purple/5 py-2 pl-4 italic text-slate-300 my-6 rounded-r; }
      .prose strong { @apply text-white font-semibold; }
      .prose a { @apply text-cyber-blue hover:underline; }
      
      /* Grid Background */
      .bg-grid {
        background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 30px 30px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div class="scanline-overlay"></div>
  </body>
</html>
